name: Recoger viento

on:
  # Cada ejecución recoge lecturas durante 55 minutos y lanza la siguiente.
  workflow_dispatch:
  # Respaldo: si la cadena se rompe, este cron la reanuda.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: recoger-viento
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recoger lecturas cada 5 minutos
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/loop.sh
