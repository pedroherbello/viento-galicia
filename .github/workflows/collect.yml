name: Recoger viento

on:
  schedule:
    # MeteoGalicia publica una lectura cada 10 min. Se consulta cada 5 min
    # porque GitHub a veces retrasa las tareas programadas.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recoger-viento
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cargar datos guardados (rama data)
        run: |
          mkdir -p out
          if git fetch --quiet --depth=1 origin data; then
            git show FETCH_HEAD:spots.json > out/spots.json || rm -f out/spots.json
          fi

      - name: Leer MeteoGalicia
        run: node scripts/collect.mjs out/spots.json

      - name: Publicar en la rama data
        if: ${{ hashFiles('out/.changed') != '' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -f .changed
          git init --quiet -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spots.json
          git commit --quiet -m "Lecturas $(date -u +%Y-%m-%dT%H:%MZ)"
          # Un único commit, reemplazado cada vez, para que el repositorio no crezca.
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
